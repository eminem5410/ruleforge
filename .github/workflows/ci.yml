name: RuleForge CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio
        
    - name: Run Python Tests
      run: pytest tests/ -q
      
    - name: Run C# Tests
      run: dotnet test dotnet/ --configuration Release
      
    - name: Build Cross-Language Runner
      run: dotnet build dotnet/src/RuleForge.ConformanceRunner/RuleForge.ConformanceRunner.csproj --configuration Release
      
    - name: Run Cross-Language Conformance
      run: python3 run_cross_language_conformance.py
