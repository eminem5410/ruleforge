[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge"
version = "7.0.1"
description = "A deterministic, typed, and sandboxed domain-independent rule engine."
authors = [{name = "Pablo Diez"}]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi"
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx", "aiosqlite"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[tool.setuptools.packages.find]
include = ["ruleforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
