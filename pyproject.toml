[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge-engine"
version = "12.0.2"
description = "Deterministic, typed, sandboxed, and auditable rule execution engine for predictable policy decisions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pablo Diez", email = "eminem5410@users.noreply.github.com"}
]
keywords = [
    "rule-engine",
    "policy-engine",
    "dsl",
    "domain-specific-language",
    "deterministic",
    "compiler",
    "parser",
    "lexer",
    "ast",
    "pattern-matching",
    "sandbox",
    "audit",
    "compliance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed"
]
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi"
]

[project.optional-dependencies]
dev = ["hypothesis"]
test = ["pytest", "pytest-asyncio", "httpx", "aiosqlite"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[project.urls]
Homepage = "https://github.com/eminem5410/ruleforge"
Documentation = "https://github.com/eminem5410/ruleforge#readme"
Repository = "https://github.com/eminem5410/ruleforge"
"Bug Tracker" = "https://github.com/eminem5410/ruleforge/issues"
"Release Notes" = "https://github.com/eminem5410/ruleforge/releases"

[tool.setuptools.packages.find]
include = ["ruleforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
