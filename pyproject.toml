[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge"
version = "5.0.0"
description = "A deterministic, typed, and sandboxed domain-independent rule engine."
authors = [{name = "Pablo Diez"}]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite"
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[tool.setuptools.packages.find]
include = ["ruleforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
