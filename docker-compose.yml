services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ruleforge
      POSTGRES_PASSWORD: ruleforge
      POSTGRES_DB: ruleforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ruleforge:ruleforge@postgres:5432/ruleforge
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
